name: FrostyGoop (BACnet)
family: FrostyGoop Variant
year: '2024'
protocol: BACnet/IP
target: PLC-5 Building HVAC ({hvac}:47808)
desc: FrostyGoop methodology adapted for BACnet - the dominant protocol in building automation. WhoIs
